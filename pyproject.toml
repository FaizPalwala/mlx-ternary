[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx_ternary"
version = "0.6.0"
description = "High-performance Apple Silicon runtime for 1.58-bit ternary language models."
readme = "README.md"
license = "MIT"
authors = [
    {name = "Faiz Palwala", email = "faiz.palwala@gmail.com"}
]
keywords = ["mlx", "apple-silicon", "metal", "quantization", "ternary", "bitnet", "llm", "deep-learning"]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: MacOS :: MacOS X",
    "Environment :: GPU",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mlx>=0.20.0",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/FaizPalwala/mlx-ternary"
Repository = "https://github.com/FaizPalwala/mlx-ternary"
Documentation = "https://faizpalwala.tech/projects/mlx-ternary"
Issues = "https://github.com/FaizPalwala/mlx-ternary/issues"
Changelog = "https://github.com/FaizPalwala/mlx-ternary/releases"

[project.optional-dependencies]
dev = [
    "pytest",
]
serve = [
    "mlx-lm>=0.16.0",
    "transformers",
    "huggingface_hub",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
mlx_ternary = "mlx_ternary.cli:main"
"mlx-ternary" = "mlx_ternary.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
