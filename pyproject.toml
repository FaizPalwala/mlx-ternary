[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx_ternary"
version = "0.5.0a0"
description = "High-performance Apple Silicon runtime for 1.58-bit ternary language models."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mlx>=0.16.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
serve = [
    "mlx-lm>=0.16.0",
    "transformers",
    "huggingface_hub",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
mlx_ternary = "mlx_ternary.cli:main"
